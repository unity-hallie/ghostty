name: Build Feedback Buffer Branch

on:
  push:
    branches: [feature/feedback-buffer]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app || sudo xcode-select -s /Applications/Xcode_26.app
          xcodebuild -version

      - name: Get Zig deps via Nix
        id: deps
        run: nix build -L .#deps && echo "deps=$(readlink ./result)" >> $GITHUB_OUTPUT

      # Build GhosttyKit framework via Zig
      - name: Build GhosttyKit
        run: nix develop -c zig build --system ${{ steps.deps.outputs.deps }} -Demit-macos-app=false

      # Build the native macOS app via Xcode (MUST be outside Nix env)
      - name: Build Ghostty.app
        run: cd macos && xcodebuild -target Ghostty -configuration Debug

      - name: Upload Ghostty.app
        uses: actions/upload-artifact@v4
        with:
          name: Ghostty-feedback-buffer
          path: macos/build/Debug/Ghostty.app

name: Build Feedback Buffer Branch

on:
  push:
    branches: [feature/feedback-buffer]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true

      - name: Get Zig deps via Nix
        id: deps
        run: nix build -L .#deps && echo "deps=$(readlink ./result)" >> $GITHUB_OUTPUT

      # Build everything Zig can build (no native macOS app)
      - name: Build GhosttyKit
        run: nix develop -c zig build --system ${{ steps.deps.outputs.deps }} -Demit-macos-app=false

      - name: List zig-out contents
        run: find zig-out -type f -o -type l | sort

      - name: Upload entire zig-out
        uses: actions/upload-artifact@v4
        with:
          name: Ghostty-feedback-buffer
          path: zig-out/

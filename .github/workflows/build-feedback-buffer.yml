name: Build Feedback Buffer Branch

on:
  push:
    branches: [feature/feedback-buffer]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true

      - name: Get Zig deps via Nix
        id: deps
        run: nix build -L .#deps && echo "deps=$(readlink ./result)" >> $GITHUB_OUTPUT

      # Build GhosttyKit framework + CLI binary (no Xcode 26 needed)
      - name: Build GhosttyKit
        run: nix develop -c zig build --system ${{ steps.deps.outputs.deps }} -Demit-macos-app=false

      - name: Package artifacts
        run: |
          mkdir -p artifact
          # Copy the CLI binary
          cp zig-out/bin/ghostty artifact/ 2>/dev/null || true
          # Copy the framework
          cp -R zig-out/lib/GhosttyKit.framework artifact/ 2>/dev/null || true
          # Copy resources (shell integration, themes, etc)
          cp -R zig-out/share artifact/ 2>/dev/null || true
          # List what we got
          find artifact -type f | head -50

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ghostty-feedback-buffer
          path: artifact/
